groups:
  - name: llm_cost_alerts
    rules:
      - alert: LLMCostRunaway
        expr: increase(llm_cost_usd_total[1h]) > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "LLM spend exceeds $50/hour"
          description: "Provider={{ $labels.provider }} spent ${{ $value }} in last hour"

      - alert: LLMProviderDown
        expr: llm_circuit_breaker_state == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LLM provider circuit breaker open"
          description: "Provider={{ $labels.provider }} circuit breaker is OPEN"

      - alert: KafkaConsumerLag
        expr: kafka_consumer_lag_messages > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Topic={{ $labels.topic }}, lag={{ $value }} messages"

      - alert: MatchPipelineP95Slow
        expr: histogram_quantile(0.95, rate(match_pipeline_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Match pipeline P95 latency exceeds 30s"

      - alert: VectorSearchLatency
        expr: histogram_quantile(0.99, rate(vector_search_latency_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Qdrant P99 latency exceeds 500ms"
