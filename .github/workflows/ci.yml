name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check services/ shared/ ml/

      - name: Mypy type check
        run: mypy services/ shared/ --ignore-missing-imports

  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, job-service, ai-orchestration, worker-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobmatch_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jobmatch_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-32-characters-long
          JWT_SECRET: test-jwt-secret-32-characters-long
          OPENAI_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
        run: pytest services/${{ matrix.service }}/tests/ -v --asyncio-mode=auto --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: ${{ matrix.service }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan (repo)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service: [user-service, job-service, ai-orchestration, worker-service]

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push
        env:
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ matrix.service }}:${{ github.sha }}
        run: |
          docker build \
            -f infra/docker/Dockerfile.service \
            --build-arg SERVICE=${{ matrix.service }} \
            -t $IMAGE \
            services/${{ matrix.service }}
          docker push $IMAGE

      - name: Update Helm values
        run: |
          sed -i "s|tag:.*|tag: ${{ github.sha }}|g" \
            infra/helm/jobmatch/values-${{ matrix.service }}.yaml
          git config user.email "ci@jobmatch.ai"
          git config user.name "CI Bot"
          git add infra/helm/
          git commit -m "ci: update ${{ matrix.service }} image to ${{ github.sha }}" || true
          git push
