name: CD — Deploy to Staging / Prod

on:
  push:
    branches: [main]
    paths:
      - "infra/helm/**"

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials jobmatch-staging --region us-central1

      - name: Helm diff
        run: |
          helm diff upgrade jobmatch infra/helm/jobmatch \
            --namespace api \
            -f infra/helm/jobmatch/values-staging.yaml

      - name: Helm upgrade
        run: |
          helm upgrade --install jobmatch infra/helm/jobmatch \
            --namespace api \
            --create-namespace \
            -f infra/helm/jobmatch/values-staging.yaml \
            --atomic \
            --timeout 5m \
            --cleanup-on-fail

      - name: Smoke tests
        run: |
          sleep 10
          curl -f https://staging-api.jobmatch.ai/healthz

  deploy-prod:
    name: Deploy to Production (Canary)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials jobmatch-prod --region us-central1

      - name: Deploy canary (10% traffic)
        run: |
          helm upgrade --install jobmatch-canary infra/helm/jobmatch \
            --namespace api \
            -f infra/helm/jobmatch/values-prod.yaml \
            --set canary.enabled=true \
            --set canary.weight=10 \
            --atomic --timeout 5m

      - name: Wait and verify canary
        run: |
          echo "Canary deployed. Waiting 3 minutes for error rate check..."
          sleep 180
          ERROR_RATE=$(curl -s "https://prometheus.jobmatch.ai/api/v1/query?query=rate(http_requests_total{status=~'5..'}[2m])/rate(http_requests_total[2m])" | jq -r '.data.result[0].value[1]')
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "Error rate too high: $ERROR_RATE — rolling back"
            helm rollback jobmatch-canary
            exit 1
          fi
          echo "Canary healthy (error rate: $ERROR_RATE) — promoting to 100%"

      - name: Promote to full production
        run: |
          helm upgrade jobmatch-canary infra/helm/jobmatch \
            --namespace api \
            -f infra/helm/jobmatch/values-prod.yaml \
            --set canary.enabled=false \
            --atomic --timeout 5m
