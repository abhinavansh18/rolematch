version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobmatch
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes: [zookeeper_data:/var/lib/zookeeper]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
    volumes: [kafka_data:/var/lib/kafka]

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/docker/qdrant_config.yaml:/qdrant/config/production.yaml

  # ── Application Services ───────────────────────────────────────────────────
  user-service:
    build:
      context: ./services/user-service
      dockerfile: ../../infra/docker/Dockerfile.service
    env_file: .env
    environment:
      SERVICE_NAME: user-service
      PORT: 8001
    ports: ["8001:8001"]
    depends_on: [postgres, redis]
    volumes: ["./services/user-service:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  job-service:
    build:
      context: ./services/job-service
      dockerfile: ../../infra/docker/Dockerfile.service
    env_file: .env
    environment:
      SERVICE_NAME: job-service
      PORT: 8002
    ports: ["8002:8002"]
    depends_on: [postgres, redis, kafka, qdrant]
    volumes: ["./services/job-service:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  ai-orchestration:
    build:
      context: ./services/ai-orchestration
      dockerfile: ../../infra/docker/Dockerfile.service
    env_file: .env
    environment:
      SERVICE_NAME: ai-orchestration
      PORT: 8003
    ports: ["8003:8003"]
    depends_on: [postgres, redis, kafka, qdrant]
    volumes: ["./services/ai-orchestration:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  worker-service:
    build:
      context: ./services/worker-service
      dockerfile: ../../infra/docker/Dockerfile.service
    env_file: .env
    environment:
      SERVICE_NAME: worker-service
    depends_on: [postgres, redis, kafka, qdrant]
    volumes: ["./services/worker-service:/app"]
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  qdrant_data:
