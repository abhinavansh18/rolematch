# ExternalSecret pulls from AWS Secrets Manager / GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-api-keys
  namespace: {{ .Values.namespace | default "api" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.store }}
    kind: ClusterSecretStore
  target:
    name: llm-api-keys
    creationPolicy: Owner
  data:
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: {{ .Values.externalSecrets.prefix }}/llm-keys
      property: openai_key
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: {{ .Values.externalSecrets.prefix }}/llm-keys
      property: anthropic_key
  - secretKey: GROQ_API_KEY
    remoteRef:
      key: {{ .Values.externalSecrets.prefix }}/llm-keys
      property: groq_key
  - secretKey: SECRET_KEY
    remoteRef:
      key: {{ .Values.externalSecrets.prefix }}/app-secrets
      property: secret_key
  - secretKey: JWT_SECRET
    remoteRef:
      key: {{ .Values.externalSecrets.prefix }}/app-secrets
      property: jwt_secret
