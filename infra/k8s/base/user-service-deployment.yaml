apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: user-service
        image: gcr.io/PROJECT_ID/user-service:IMAGE_TAG
        ports:
        - containerPort: 8001
        envFrom:
        - secretRef:
            name: db-credentials
        - configMapRef:
            name: app-config
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits:   {cpu: 1000m, memory: 1Gi}
        livenessProbe:
          httpGet: {path: /healthz, port: 8001}
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /healthz, port: 8001}
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: api
spec:
  selector:
    app: user-service
  ports:
  - port: 80
    targetPort: 8001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
